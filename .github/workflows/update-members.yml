name: Update Members from Sheet

# Manually-triggered sync: pulls the public Google Sheet, regenerates
# src/lib/data/members.ts, and commits the change (which redeploys the site
# via the "Deploy to GitHub Pages" workflow).
on:
  workflow_dispatch:
    inputs:
      sheet_url:
        description: 'Google Sheet URL (shared as "Anyone with the link → Viewer")'
        required: true
        default: 'https://docs.google.com/spreadsheets/d/1QRARj6jqvIBj7FSc0yBSqbzWnpft21l4goP-I1VyAkI/edit?usp=sharing'

permissions:
  contents: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch sheet and regenerate members.ts
        env:
          SHEET_URL: ${{ inputs.sheet_url }}
        run: node .github/scripts/update-members.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/members.ts
          if git diff --cached --quiet; then
            echo "::notice::Member data is already up to date — nothing to commit."
          else
            git commit -m "chore(members): refresh member data from Google Sheet"
            git push
          fi
